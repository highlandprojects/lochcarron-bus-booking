<script>
"use strict";
/* =====================================================================
   Take Booking: the staff screen for taking a booking over the telephone.
   Named by the operator on 31 August; the manager screen still to come is
   the Back office, and the two are deliberately different words.

   Written for the way the garage actually works. Most Service 704
   customers are elderly and ring rather than tap, so the person on this
   screen is holding a telephone in one hand. That shapes everything:

     - ONE FORM, not a wizard. A caller says "Tuesday, two of us, from
       the Post Office to Dingwall" in one breath, and the person taking
       it should be able to type it in the same order without pressing
       Next four times.
     - THE ANSWER TO "IS THERE ROOM" IS ALWAYS ON SCREEN. Seats left is
       the busiest section, never a head count.
     - EVERY REFUSAL SAYS WHAT TO DO NEXT. "The bus is full" is no use on
       the telephone; "the bus is full at twelve, but seat thirteen
       exists if you will write down why" is.

   The database is the authority for all of it. This page can be wrong,
   cached or out of date; the functions it calls cannot be talked round.
===================================================================== */

const SUPABASE_URL = "https://wkyjsdiqnuknnkyavnyd.supabase.co";
const ANON_KEY = "sb_publishable_y22lUaDRfZBvVoUHcwNb_Q_gSqw7Pa_";
const STORE_KEY = "bus704.office.session";

/* ------------------------------------------------------------------
   Signing in
------------------------------------------------------------------ */
let SESSION = null;   // {access_token, refresh_token, expires_at}
let ME = null;        // what bus_staff_whoami() said

function loadSession(){
  try{
    const raw = window.localStorage.getItem(STORE_KEY);
    if(raw) SESSION = JSON.parse(raw);
  }catch(_){ SESSION = null; }
}
function saveSession(s){
  SESSION = s;
  try{
    if(s) window.localStorage.setItem(STORE_KEY, JSON.stringify(s));
    else window.localStorage.removeItem(STORE_KEY);
  }catch(_){}
}

async function authPost(grant, body){
  const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=" + grant, {
    method: "POST",
    headers: {apikey: ANON_KEY, "Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.error || "sign_in_failed");
  return {
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expires_at: Date.now() + ((j.expires_in || 3600) - 60) * 1000
  };
}

async function signIn(email, password){
  saveSession(await authPost("password", {email: email, password: password}));
}

async function freshToken(){
  if(!SESSION) throw new Error("not_signed_in");
  if(SESSION.expires_at && Date.now() > SESSION.expires_at){
    saveSession(await authPost("refresh_token", {refresh_token: SESSION.refresh_token}));
  }
  return SESSION.access_token;
}

/* Every call to the database goes through here, so there is one place
   that knows about tokens and one place that turns a database error into
   a sentence. */
async function rpc(fn, args){
  const token = await freshToken();
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: {
      apikey: ANON_KEY,
      Authorization: "Bearer " + token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(args || {})
  });
  if(r.status === 401){
    saveSession(null);
    throw new Error("your_sign_in_has_run_out");
  }
  const text = await r.text();
  let body = null;
  try{ body = text ? JSON.parse(text) : null; }catch(_){ body = null; }
  if(!r.ok){
    const e = new Error((body && (body.message || body.hint)) || text || "request_failed");
    e.code = body && body.message ? String(body.message) : "";
    throw e;
  }
  return body;
}

/* ------------------------------------------------------------------
   Turning a database error into something to say on the telephone
------------------------------------------------------------------ */
async function loadDays(){
  try{
    DAYS = await rpc("bus_staff_days", {}) || [];
    try{ CRIB = await rpc("bus_staff_crib", {}) || []; }catch(_){ CRIB = []; }
    /* The tabs want different days, and it is worth being deliberate.

       THE DAY and WHO TO TELEPHONE want TODAY when the bus is running
       today - that is the run in progress, the one somebody is asking
       about, and on a snowy morning the telephone list for today is the
       screen that matters. Only when today is not a running day do they
       move to the next one.

       TAKE A BOOKING wants the first day that can actually be BOOKED.
       Opening it on today's run, when the deadline went at six o'clock
       last night, invites somebody to fill in a whole form and be refused
       at the end. */
    const t0 = today();
    const runningToday = DAYS.find(d => d.date === t0);
    const nextRunning  = DAYS.find(d => d.date >= t0) || DAYS[DAYS.length - 1];
    const firstOpen    = DAYS.find(d => d.bookable) || nextRunning;

    if(!DAYS.some(d => d.date === day.date))  day.date  = (runningToday || nextRunning).date;
    if(!DAYS.some(d => d.date === ring.date)) ring.date = (runningToday || nextRunning).date;
    if(firstOpen) take.date = firstOpen.date;
  }catch(e){ DAYS = []; }
}

/* A dropdown of running days. Falls back to a plain date box only if the
   list could not be fetched - better a usable screen than a dead one. */
function dayPicker(id, value){
  if(!DAYS || !DAYS.length){
    return '<input id="' + id + '" type="date" value="' + esc(value) + '">';
  }
  let h = '<select id="' + id + '">';
  if(!DAYS.some(d => d.date === value)){
    h += '<option value="' + esc(value) + '" selected>' + esc(niceDate(value)) + '</option>';
  }
  DAYS.forEach(d => {
    const shut = d.status === 'deadline_passed' ? ' — booking closed'
               : d.status === 'date_in_past'    ? ' — has been'
               : d.status === 'journey_cancelled' ? ' — stood down'
               : d.status === 'service_closed'  ? ' — not running'
               : '';
    const n = Number(d.booked) > 0 ? '  (' + d.booked + ' booked)' : '';
    h += '<option value="' + esc(d.date) + '"' + (d.date === value ? ' selected' : '') + '>' +
         esc(d.label) + esc(shut) + esc(n) + '</option>';
  });
  return h + '</select>';
}

function dayStatus(d){
  const row = (DAYS || []).find(x => x.date === d);
  return row ? row.status : null;
}

const SAY = {
  not_permitted_to_take_bookings:
    "Your account is not allowed to take bookings. Ask Duncan to give you access.",
  not_permitted_to_cancel:
    "Your account is not allowed to cancel bookings.",
  not_permitted_to_amend:
    "Your account is not allowed to change bookings.",
  lead_passenger_name_required:
    "Put the caller's name in first — the driver needs to know who to look for.",
  invalid_direction: "Choose which way the bus is going.",
  invalid_journey_span:
    "The setting-down place has to be further along the route than the pick-up.",
  pickup_required: "Choose where the bus is picking them up.",
  destination_required: "Choose where they are getting off.",
  some_way_to_reach_them_required:

  office_deadline_passed:

  deadline_passed:
    "The deadline has gone for that day.",
  date_in_past: "That date has already been.",
  beyond_advance_window: "That is more than two months ahead — bookings do not open that far out.",
  not_an_operating_day: "The bus does not run that day.",
  service_closed: "We are closed that day.",
  journey_cancelled: "That journey has been stood down. Do not book onto it.",
  unavailable: "That journey is not taking bookings.",
  boarding_in_setdown_only_section:
    "Coming home, past Lochcarron the bus can set people down but cannot pick them up. " +
    "Pick a place before Lochcarron, or the outward journey instead.",
  override_needs_a_reason:
    "Write down why you are using seat 13 or 14. Somebody will be asked about it one day.",
  full_but_override_possible:
    "The bus is full at twelve on the busiest part of that journey — but seats 13 and 14 exist.",
  no_room_on_the_busiest_section:
    "There is genuinely no room on the busiest part of that journey, even with seats 13 and 14.",
  booking_not_found: "That booking is not there any more — reload the day.",
  not_permitted: "Your account is not allowed to change bookings.",
  booking_already_cancelled:
    "That booking is already cancelled, so there is nothing to change. If they want to travel " +
    "after all, take a new booking.",
  no_such_stop:
    "That stop is not on the route any more. Reload the day and choose again.",
  no_way_to_reach_them:
    "Leave at least one way to reach them — a mobile, a landline or an email. A landline on " +
    "its own is fine. To take every contact away you would have to cancel the booking.",
  booking_is_not_confirmed: "That booking is already cancelled.",
  party_size_must_be_at_least_one:
    "A booking has to be for at least one person. To take it to nobody, cancel it.",
  your_sign_in_has_run_out: "Your sign-in has run out. Please sign in again.",
  not_signed_in: "Please sign in.",
  invalid_channel: "Something is wrong with this screen — tell whoever set it up.",
  no_auto_contact_needs_acknowledgement:
    "We have no mobile and no email for this passenger, so if the bus is ever stood down " +
    "NOTHING will reach them automatically — somebody will have to ring. That is allowed, " +
    "and it is normal on this route. Say so below and press the button again."
};
/* The second argument is what did NOT happen, and it matters. The old
   wording said "NOTHING has been booked" whatever went wrong, which is a
   lie on the amend panel - the office reads it, believes the booking is
   gone, and takes it again. */
function say(err, what){
  const code = (err && err.code) || String((err && err.message) || err);
  if(SAY[code]) return SAY[code];
  if(/^choose_a_stop_in/.test(code)){
    return "That spot is inside a village, where the bus uses its stops. " +
           "On the telephone you may still pin it if the caller genuinely needs the door — " +
           "if this appeared, tell whoever set the screen up.";
  }
  if(/Bicycles are not carried/.test(code)) return code;
  if(/duplicate key|already exists/i.test(code))
    return "That looks like it has already been entered. Reload the day and check.";
  return "It did not go through, and NOTHING has been " + (what || "booked") + ". " +
         "What the database said was: " + code;
}

/* ------------------------------------------------------------------
   State
------------------------------------------------------------------ */
let CFG = null;                       // bus_page_config
const DIR = {};                       // stops by direction
let TAB = "day";
const today = () => new Date().toISOString().slice(0, 10);

/* THE DAYS THE BUS RUNS.
   Fetched once and shared by all three tabs. The operator's point, on first
   real use: a free date box will take any day of the year, so a member of
   staff with a caller waiting can pick a Tuesday and have to start again.
   A list that only contains running days cannot be got wrong. It comes from
   the database rather than being worked out here, because "which days does
   the bus run" is the timetable, less stand-downs, against a deadline that
   depends on the garage's opening hours - and a page that worked that out
   for itself would be a second opinion that eventually disagrees. */
let DAYS = null;             // [{date, status, bookable, label, short, booked}]

/* THE CRIB SHEET. Fetched once at sign-in. Written to be read ALOUD with a
   customer on the telephone - question first, then words the person can say
   straight back. Each answer also carries WHY, because anyone who only
   learns the rule gets talked round by a persistent caller and anyone who
   knows the reason does not. */
let CRIB = null;
let CRIB_OPEN = {};          // slug -> true when expanded

const day = {date: today(), journeys: [], bookings: [], loading: false, message: null};
const ring = {date: today(), rows: [], loaded: false};

const take = {
  date: today(),
  direction: "outward",
  customer: null,        // chosen from the search
  search: "", results: null, searching: false,
  newName: "", homeArea: "",
  mobile: "", landline: "", email: "",
  party: 1,
  pickupId: "", destId: "",
  pin: null,             // {lat, lng, order, text} when picking up off-list
  pinMode: false,
  reqs: {},
  otherPassengers: "",
  note: "",
  override: false, overrideReason: "",
  ackNoMessages: false, ackNeeded: false,
  busy: false, error: null, done: null,
  /* Set only when this booking is the journey home of one just taken. */
  homeBusy: false, homeFrom: null, linkTo: null
};

/* Bicycles are deliberately absent. The database refuses them (migration
   0017) and offering a tick box that always fails would be worse than
   not offering it at all. The crib note tells staff what to say. */
const REQS = [
  {k: "walking_aid",        l: "Walking stick or frame"},
  {k: "folding_wheelchair", l: "Folding wheelchair", d: "Prior arrangement. Not accessible; they must be able to board."},
  {k: "pushchair",          l: "Pushchair"},
  {k: "large_luggage",      l: "Large or unusual luggage", d: "May need the trailer."},
  {k: "dog",                l: "Dog", d: "We try, but cannot promise if another passenger objects."},
  {k: "other",              l: "Something else"}
];

function wording(k, d){ return (CFG && CFG.wording && CFG.wording[k]) || d || ""; }

/* The database stores requirement types as words like "walking_aid",
   which is right for a database and wrong for a screen somebody reads at
   speed. The detail a customer typed is kept exactly as they typed it. */
const REQ_WORDS = {
  folding_wheelchair: "folding wheelchair",
  walking_aid: "walking stick or frame",
  pushchair: "pushchair",
  large_luggage: "large luggage",
  dog: "dog",
  bicycle: "bicycle",
  other: "something else"
};
function prettyReqs(s){
  if(!s) return "";
  return String(s).split(", ").map(part => {
    const m = /^([a-z_]+)(\s*\((.*)\))?$/.exec(part.trim());
    if(!m) return part;
    const word = REQ_WORDS[m[1]] || m[1].replace(/_/g, " ");
    return word + (m[3] ? " (" + m[3] + ")" : "");
  }).join(", ");
}


/* ------------------------------------------------------------------
   Stops, and where a pin falls along the road
------------------------------------------------------------------ */
const R_EARTH = 6371000;
function havM(a, b){
  const dLat = (b[1] - a[1]) * Math.PI / 180, dLng = (b[0] - a[0]) * Math.PI / 180;
  const la1 = a[1] * Math.PI / 180, la2 = b[1] * Math.PI / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.sqrt(h));
}
const ROUTELINE = {};
function routeFor(dir){
  if(ROUTELINE[dir]) return ROUTELINE[dir];
  const gj = (CFG.routes || {})[dir];
  const coords = gj && gj.geometry && gj.geometry.coordinates;
  if(!coords || coords.length < 2) return null;
  const cum = [0];
  for(let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + havM(coords[i - 1], coords[i]));
  const line = {coords, cum, stopAlong: {}};
  (DIR[dir] ? DIR[dir] : []).forEach(s => {
    line.stopAlong[s.n] = projectToLine(line, [s.lng, s.lat]).along;
  });
  ROUTELINE[dir] = line;
  return line;
}
function projectToLine(line, p){
  const {coords, cum} = line;
  const cosLat = Math.cos(p[1] * Math.PI / 180);
  const M = Math.PI / 180 * R_EARTH;
  const px = p[0] * cosLat * M, py = p[1] * M;
  let best = {off: Infinity, along: 0, point: coords[0]};
  for(let i = 0; i < coords.length - 1; i++){
    const a = coords[i], b = coords[i + 1];
    const ax = a[0] * cosLat * M, ay = a[1] * M, bx = b[0] * cosLat * M, by = b[1] * M;
    const dx = bx - ax, dy = by - ay;
    const L2 = dx * dx + dy * dy;
    let t = L2 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0;
    t = Math.max(0, Math.min(1, t));
    const qx = ax + t * dx, qy = ay + t * dy;
    const off = Math.hypot(px - qx, py - qy);
    if(off < best.off){
      best = {off, along: cum[i] + t * (cum[i + 1] - cum[i]),
              point: [qx / (cosLat * M), qy / M]};
    }
  }
  return best;
}
function describeAlong(dir, along){
  const line = routeFor(dir), stops = DIR[dir] || [];
  const withAlong = stops.map(s => ({s, at: line.stopAlong[s.n]}))
                         .filter(x => x.at !== undefined).sort((a, b) => a.at - b.at);
  if(!withAlong.length) return {order: 1, text: "On the route"};
  for(const x of withAlong){
    if(Math.abs(x.at - along) <= 400) return {snapped: x.s, order: x.s.o, text: "At " + x.s.n};
  }
  if(along <= withAlong[0].at)
    return {snapped: withAlong[0].s, order: withAlong[0].s.o, text: "At " + withAlong[0].s.n};
  const last = withAlong[withAlong.length - 1];
  if(along >= last.at) return {snapped: last.s, order: last.s.o, text: "At " + last.s.n};
  let from = withAlong[0], to = last;
  for(let i = 0; i < withAlong.length - 1; i++){
    if(along >= withAlong[i].at && along <= withAlong[i + 1].at){
      from = withAlong[i]; to = withAlong[i + 1]; break;
    }
  }
  const frac = (along - from.at) / ((to.at - from.at) || 1);
  const miles = Math.round(((along - from.at) / 1609.34) * 10) / 10;
  return {
    snapped: null,
    order: from.s.o + frac * (to.s.o - from.s.o),
    text: "Between " + from.s.n + " and " + to.s.n + " — about " +
          miles + (miles === 1 ? " mile" : " miles") + " past " + from.s.n
  };
}

function localTimes(dir){
  const raw = wording(dir === "return" ? "local_point_times_return" : "local_point_times_outward", "");
  const out = {};
  raw.split(";").forEach(part => {
    const m = part.split("=");
    if(m.length === 2) out[m[0].trim()] = m[1].trim();
  });
  return out;
}
async function loadDirection(dir){
  if(DIR[dir]) return DIR[dir];
  const stops = await rpc("bus_stops", {p_direction: dir});
  const printed = {};
  ((CFG.timetable || {})[dir] || []).forEach(t => { printed[t.name] = t; });
  const times = localTimes(dir);
  DIR[dir] = stops.map(s => ({
    id: s.id, n: s.name, o: Number(s.route_order),
    lat: Number(s.latitude), lng: Number(s.longitude),
    local: s.point_type === "approved",
    t: (printed[s.name] && printed[s.name].time) || times[s.name] || null
  })).sort((a, b) => a.o - b.o);
  return DIR[dir];
}

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const el = id => document.getElementById(id);
const M = () => el("main");

function niceDate(d){
  try{
    return new Date(d + "T12:00:00").toLocaleDateString("en-GB",
      {weekday: "long", day: "numeric", month: "long"});
  }catch(_){ return d; }
}

function render(){
  if(!SESSION){ return renderSignIn(); }
  if(ME && !ME.active) return renderNoAccess();
  el("tabs").classList.remove("hidden");
  el("signout").classList.remove("hidden");
  el("who").textContent = ME ? (ME.name || ME.email || "") : "";
  Array.from(el("tabs").children).forEach(b => {
    b.setAttribute("aria-selected", String(b.dataset.tab === TAB));
  });
  if(TAB === "day") return renderDay();
  if(TAB === "take") return renderTake();
  if(TAB === "crib"){ renderCrib(); return; }
  if(TAB === "ring") return renderRing();
}

  el("who").textContent = "";
  M().innerHTML =

/* Tap a question, get the answer. The answer is what to SAY; the note
   underneath is why, for the person reading it rather than the caller. */
function renderCrib(){
  let html =
    '<div class="card">' +
      '<h2>What do I say?</h2>' +
      '<p class="muted">The plain answer, in words you can read out. Tap a question.</p>' +
    '</div>';

  if(!CRIB){ html += '<div class="card">Loading…</div>'; }
  else if(!CRIB.length){
    html += '<div class="card"><p>No answers have been written yet.</p></div>';
  }else{
    CRIB.forEach(c => {
      const open = !!CRIB_OPEN[c.slug];
      html += '<div class="card" style="padding:0;overflow:hidden">' +
        '<button class="cribq" data-crib="' + esc(c.slug) + '" aria-expanded="' + open + '">' +
          '<span>' + esc(c.question) + '</span>' +
          '<span class="chev">' + (open ? '&#9662;' : '&#9656;') + '</span>' +
        '</button>' +
        (open
          ? '<div class="criba">' +
              '<p class="say">' + esc(c.answer) + '</p>' +
              (c.reason ? '<p class="why"><strong>Why:</strong> ' + esc(c.reason) + '</p>' : '') +
            '</div>'
          : '') +
      '</div>';
    });
    const foot = (CFG && CFG.wording && CFG.wording.office_crib_footer) ||
      'If you do not know, say you will find out and ring them back. Never guess at something that affects whether somebody can travel.';
    html += '<div class="card"><p><strong>' + esc(foot) + '</strong></p></div>';
  }

  M().innerHTML = html;
  M().querySelectorAll("button[data-crib]").forEach(b => {
    b.onclick = () => {
      const s = b.getAttribute("data-crib");
      CRIB_OPEN[s] = !CRIB_OPEN[s];
      renderCrib();
    };
  });
}

/* ---------------------------- The day ---------------------------- */
function renderDay(){
  const j = day.journeys;
  let html =
    '<div class="card">' +
      '<label for="dd">Which day</label>' +
      '<div class="row">' +
        dayPicker("dd", day.date) +
        '<button class="btn secondary" id="dtoday">Today</button>' +
        '<button class="btn secondary" id="dnext">Next day →</button>' +
      '</div>' +
      '<p class="muted" style="margin:.6rem 0 0">' + esc(niceDate(day.date)) + '</p>' +
    '</div>';

  if(day.loading){ html += '<div class="card">Loading the day…</div>'; }
  else if(day.message){ html += '<div class="card"><div class="bad">' + esc(day.message) + '</div></div>'; }
  else if(!j.length){
    /* NOT "nothing is running". The operator's screenshot showed that
       sentence against a Monday the bus was running on - what was true was
       that booking had closed. Three different situations had been collapsed
       into one, and the one that matters is the difference between "there is
       no bus" and "there is a bus but you cannot book it now". Telling staff
       the second is the first is how a caller is turned away from a bus
       sitting in the yard. */
    const st = dayStatus(day.date);
    const line =
      st === 'deadline_passed'   ? 'The bus runs that day, but booking has closed. Nobody is booked on it.'
    : st === 'date_in_past'      ? 'That day has been, and nobody was booked on it.'
    : st === 'journey_cancelled' ? 'That run has been stood down.'
    : st === 'service_closed'    ? 'The bus is not running that day.'
    : st === 'ok'                ? 'The bus runs that day and nobody is booked on it yet.'
    :                              'Nothing is booked for that day.';
    html += '<div class="card"><p>' + esc(line) + '</p>' +
            '<p class="muted">A journey appears here as soon as the first person is booked onto it.</p></div>';
  }else{
    j.forEach(row => {
      const bks = day.bookings.filter(b => b.direction === row.direction);
      const left = Number(row.seats_left_public);
      const cls = left <= 0 ? "none" : (left <= 2 ? "low" : "");
      html += '<div class="journey">' +
        '<div class="head">' +
          '<strong>' + (row.direction === "outward" ? "To Inverness" : "Home from Inverness") + '</strong>' +
          '<span class="seats ' + cls + '">' + left + '</span>' +
          '<span class="muted">' + (left === 1 ? "seat left" : "seats left") +
            ' of twelve' + (Number(row.seats_left_max) > left ?
              ' &middot; ' + Number(row.seats_left_max) + ' with 13 and 14' : '') + '</span>' +
        '</div>' +
        /* NO BOOKING OR PASSENGER COUNT. Removed on the operator's
           instruction, 31 Aug 2026: a count of bookings is not a count of
           passengers - people get on and off along the road, walk-ons are
           never booked, and a party of three is one booking. A number that
           is nearly right is worse than none, because somebody eventually
           quotes it. Seats left stays: that is capacity on the busiest
           section, and it IS accurate. */
        '<div class="chips">' +
          (row.journey_status && row.journey_status !== "planned" && row.journey_status !== "confirmed"
            ? '<span class="chip warn">' + esc(row.journey_status) + '</span>' : '') +
          (Number(row.needs_telephoning) > 0
            ? '<span class="chip tel">' + row.needs_telephoning + ' to telephone</span>' : '') +
          (Number(row.overrides) > 0
            ? '<span class="chip warn">' + row.overrides + ' on seat 13/14</span>' : '') +
          (row.bookable_office !== "ok"
            ? '<span class="chip warn">office: ' + esc(row.bookable_office) + '</span>' : '') +
        '</div>';

      if(!bks.length){
        html += '<p class="muted" style="margin:.7rem 0 0">Nobody booked yet.</p>';
      }
      bks.forEach(b => {
        html += '<div class="bk" data-id="' + esc(b.booking_id) + '">' +
          '<div class="main">' +
            '<div><strong>' + esc(b.lead_name) + '</strong> · ' + b.party_size +
              (Number(b.party_size) === 1 ? " person" : " people") +
              (b.telephone_only ? ' <span class="chip tel">telephone only</span>' : '') +
              (b.is_override ? ' <span class="chip warn">seat 13/14</span>' : '') + '</div>' +
            '<div class="where">' + esc(b.pickup) + ' → ' + esc(b.destination) +
              (b.estimated_time ? ' · due ' + esc(String(b.estimated_time).slice(0, 5)) : '') + '</div>' +
            '<div class="ref">' + esc(b.reference) +
              (b.contact ? ' · ' + esc(b.contact) : '') + '</div>' +
            (b.requirements ? '<div class="where">Needs: ' + esc(prettyReqs(b.requirements)) + '</div>' : '') +
            (b.override_reason ? '<div class="where">Seat 13/14 because: ' + esc(b.override_reason) + '</div>' : '') +
            (b.notes ? '<div class="where">Note: ' + esc(b.notes) + '</div>' : '') +
          '</div>' +
          '<div class="acts">' +
            '<button class="btn secondary small" data-act="amend">Amend booking</button>' +
            '<button class="btn danger small" data-act="cancel">Cancel</button>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    });
  }
  M().innerHTML = html;

  el("dd").onchange = e => { day.date = e.target.value; loadDay(); };
  el("dtoday").onclick = () => { day.date = today(); loadDay(); };
  /* NEXT DAY MEANS THE NEXT DAY THE BUS RUNS, not tomorrow. Stepping one
     calendar day lands on a Tuesday four times out of five and shows a
     screen that cannot be acted on. */
  el("dnext").onclick = () => {
    const list = DAYS || [];
    const next = list.find(d => d.date > day.date);
    if(next){ day.date = next.date; loadDay(); }
  };
  M().querySelectorAll(".bk .acts button").forEach(btn => {
    btn.onclick = () => {
      const id = btn.closest(".bk").dataset.id;
      const b = day.bookings.find(x => x.booking_id === id);
      if(btn.dataset.act === "cancel") return doCancel(b);
      return openAmend(b);
    };
  });
}

async function loadDay(){
  day.loading = true; day.message = null; render();
  try{
    const [j, b] = await Promise.all([
      rpc("bus_staff_day", {p_service_date: day.date}),
      rpc("bus_staff_day_bookings", {p_service_date: day.date})
    ]);
    day.journeys = j || []; day.bookings = b || [];
  }catch(e){
    day.journeys = []; day.bookings = []; day.message = say(e);
  }
  day.loading = false; render();
}

async function doCancel(b){
  const why = window.prompt(
    "Cancelling " + b.reference + " for " + b.lead_name + ".\n\n" +
    "Why? (the caller rang, they are not well, and so on)", "The customer rang to cancel");
  if(why === null) return;
  try{
    const r = await rpc("bus_staff_cancel_booking", {p_booking_id: b.booking_id, p_reason: why});
    await loadDay();
    window.alert(r && r.already_cancelled
      ? b.reference + " was already cancelled — nothing has changed."
      : b.reference + " is cancelled. The seat is free again.");
  }catch(e){ window.alert(say(e)); }
}

/* --------------------------- Amend --------------------------- */
/* Replaces the old "Change number", which changed exactly one field. On the
   telephone a caller says "actually pick me up at the hall instead, and my
   mobile's changed" - and the office needed two screens and a cancel.

   Everything that can change mid-call is here in one panel. The DAY and the
   DIRECTION are deliberately absent: they decide which journey the booking
   sits on, and quietly moving somebody between runs is how a passenger ends
   up on Monday's sheet believing they are booked for Saturday. A different
   day is a cancel and a rebook, which leaves both facts on the record. */
let AMEND = null;   // {b, party, pickup, dest, mobile, email, landline, note, others}

async function openAmend(b){
  AMEND = {
    b: b,
    party:    String(b.party_size || 1),
    pickup:   b.pickup_point_id || "",
    dest:     b.destination_point_id || "",
    mobile:   b.mobile   || "",
    email:    b.email    || "",
    landline: b.landline || "",
    note:     "",
    others:   b.other_passengers || "",
    error:    ""
  };
  /* The stop list for this direction must be IN HAND before the panel is
     drawn. Drawing first and filling in afterwards leaves the office
     looking at an empty dropdown under the words "where they get on", and
     an empty dropdown there is an invitation to save a blank.

     There is no stopOptions() of its own here on purpose: the take-a-
     booking screen already has one, further down this file, and a second
     function of the same name silently replaced it. Both dropdowns came up
     empty and nothing said why. One list of stops, drawn one way. */
  try{ await loadDirection(b.direction || "outward"); }
  catch(e){ AMEND.error = say(e, "changed"); }
  renderAmend();
}

function renderAmend(){
  if(!AMEND) return;
  const b = AMEND.b;
  const dir = b.direction || "outward";
  M().innerHTML =
    '<div class="card">' +
      '<h2>Amend booking</h2>' +
      '<p class="muted">' + esc(b.lead_name || "") + ' &middot; ' +
        esc(b.reference) + ' &middot; ' + esc(niceDate(day.date)) + ' &middot; ' +
        (dir === "outward" ? "to Inverness" : "home from Inverness") + '</p>' +
      '<p class="muted">To move somebody to a different day, cancel this and take a new ' +
        'booking - that way both are on the record.</p>' +
      (AMEND.error ? '<div class="bad">' + esc(AMEND.error) + '</div>' : '') +

      '<label for="am_pt">How many travelling</label>' +
      '<input id="am_pt" type="number" min="1" max="14" value="' + esc(AMEND.party) + '">' +

      '<label for="am_on">Where they get on</label>' +
      '<select id="am_on">' + stopOptions(dir, AMEND.pickup) + '</select>' +

      /* Where they get off is limited to stops FURTHER ALONG the run than
         where they get on, exactly as it is when the booking is taken. A
         passenger cannot get off before they get on, and the fare is worked
         out between the two, so the pair has to stay in order. */
      '<label for="am_off">Where they get off</label>' +
      '<select id="am_off">' + stopOptions(dir, AMEND.dest, amendBoardOrder()) + '</select>' +

      '<label for="am_mob">Mobile</label>' +
      '<input id="am_mob" type="tel" value="' + esc(AMEND.mobile) + '">' +
      '<label for="am_em">Email</label>' +
      '<input id="am_em" type="email" value="' + esc(AMEND.email) + '">' +
      '<label for="am_ll">Landline</label>' +
      '<input id="am_ll" type="tel" value="' + esc(AMEND.landline) + '">' +
      '<p class="muted">Leave all three as they are if the caller has not changed them. ' +
        'A landline on its own means somebody has to ring them if the run is stood down.</p>' +

      '<label for="am_ot">Anyone else travelling, by name <span class="hint">One per line</span></label>' +
      '<textarea id="am_ot">' + esc(AMEND.others) + '</textarea>' +

      '<label for="am_nt">Add a note for the driver <span class="hint">Added to the booking; ' +
        'earlier notes are kept</span></label>' +
      '<textarea id="am_nt">' + esc(AMEND.note) + '</textarea>' +

      '<div style="height:.8rem"></div>' +
      '<button class="btn" id="am_save" type="button">Save the changes</button>' +
      '<div style="height:.5rem"></div>' +
      '<button class="btn secondary" id="am_back" type="button">Leave it as it is</button>' +
    '</div>';

  const keep = () => {
    AMEND.party    = el("am_pt").value;
    const wasOn    = AMEND.pickup;
    AMEND.pickup   = el("am_on").value;
    AMEND.dest     = el("am_off").value;
    AMEND.mobile   = el("am_mob").value;
    AMEND.email    = el("am_em").value;
    AMEND.landline = el("am_ll").value;
    AMEND.others   = el("am_ot").value;
    AMEND.note     = el("am_nt").value;
    /* Moving where they get on can leave where they get off behind it - the
       caller who changes Toscaig to Inverness has no valid stop left. Redraw
       the second list, and drop a destination that is now before the start
       rather than leaving an impossible pair on the screen. */
    if(AMEND.pickup !== wasOn){
      const min = amendBoardOrder();
      const d = (DIR[dir] || []).find(s => s.id === AMEND.dest);
      if(min != null && d && d.o <= min) AMEND.dest = "";
      return renderAmend();
    }
  };
  M().querySelectorAll("input,select,textarea").forEach(i => { i.onchange = keep; i.oninput = keep; });
  el("am_back").onclick = () => { AMEND = null; render(); };
  el("am_save").onclick = () => { keep(); saveAmend(false, null, false); };
}

/* Where a stop sits along the run, from the list the page already loaded.
   The route order is what the driver's sheet sorts by and what the fare is
   worked out between, so it travels with the stop or the passenger ends up
   in the wrong place on the run and on the wrong fare. */
function stopOrderOf(dir, id){
  const s = (DIR[dir] || []).find(x => x.id === id);
  return s ? s.o : null;
}
function amendBoardOrder(){
  if(!AMEND) return null;
  return stopOrderOf(AMEND.b.direction || "outward", AMEND.pickup);
}

async function saveAmend(override, overrideReason, confirmNoContact){
  const b = AMEND.b;
  const dir = b.direction || "outward";
  const stopOrder = id => stopOrderOf(dir, id);
  /* Only send what actually changed. A null tells the database to leave a
     field alone, so a box nobody touched can never blank something. */
  const args = {
    p_booking_id: b.booking_id,
    p_party_size: Number(AMEND.party) !== Number(b.party_size) ? Number(AMEND.party) : null,
    p_pickup_point_id: AMEND.pickup && AMEND.pickup !== b.pickup_point_id ? AMEND.pickup : null,
    p_board_route_order: AMEND.pickup && AMEND.pickup !== b.pickup_point_id ? stopOrder(AMEND.pickup) : null,
    p_destination_point_id: AMEND.dest && AMEND.dest !== b.destination_point_id ? AMEND.dest : null,
    p_alight_route_order: AMEND.dest && AMEND.dest !== b.destination_point_id ? stopOrder(AMEND.dest) : null,
    p_note: AMEND.note.trim() ? AMEND.note.trim() : null,
    p_other_passengers: AMEND.others !== (b.other_passengers || "") ? AMEND.others : null,
    p_override: !!override,
    p_override_reason: overrideReason,
    p_confirm_no_contact: !!confirmNoContact
  };
  const contactTouched =
    AMEND.mobile !== (b.mobile || "") || AMEND.email !== (b.email || "") ||
    AMEND.landline !== (b.landline || "");
  if(contactTouched){
    args.p_mobile = AMEND.mobile; args.p_email = AMEND.email; args.p_landline = AMEND.landline;
  }

  try{
    const res = await rpc("bus_staff_amend_booking", args);
    if(res && res.ok === false){
      /* The same two-press guard as taking a booking: a booking that
         QUIETLY becomes landline-only is worse than one that always was,
         because nobody expects it. */
      if(res.reason === "no_auto_contact_needs_acknowledgement"){
        if(window.confirm(SAY.no_auto_contact_needs_acknowledgement ||
             "Nothing will reach this passenger automatically. Somebody must ring them if the run is stood down. Save it anyway?")){
          return saveAmend(override, overrideReason, true);
        }
        return;
      }
      if(res.reason === "full_but_override_possible"){
        const why = window.prompt(SAY.full_but_override_possible +
          "\n\nWhy are you using seat 13 or 14?", "");
        if(!why) return;
        return saveAmend(true, why, confirmNoContact);
      }
      AMEND.error = say({code: res.reason}, "changed"); return renderAmend();
    }
    AMEND = null;
    await loadDay();
  }catch(e){
    if((e.code || "") === "full_but_override_possible"){
      const why = window.prompt(SAY.full_but_override_possible +
        "\n\nWhy are you using seat 13 or 14?", "");
      if(!why) return;
      return saveAmend(true, why, confirmNoContact);
    }
    AMEND.error = say(e, "changed"); renderAmend();
  }
}

/* ------------------------ Take a booking ------------------------ */
function stopOptions(dir, selectedId, minOrder){
  const stops = (DIR[dir] || []).filter(s => minOrder == null || s.o > minOrder);
  return '<option value="">— choose —</option>' + stops.map(s =>
    '<option value="' + esc(s.id) + '"' + (s.id === selectedId ? " selected" : "") + '>' +
      esc(s.n) + (s.t ? " · " + esc(s.t) : "") + (s.local ? " (local)" : "") +
    '</option>').join("");
}

function renderTake(){
  if(take.done){
    const d = take.done;
    M().innerHTML = '<div class="card">' +
      '<div class="good"><strong>Booked.</strong> The reference is <strong>' + esc(d.reference) +
      '</strong> — read it out and ask them to write it down.</div>' +
      (d.telephone_only
        ? '<div class="note">We have no mobile or email for them, so <strong>nothing will be ' +
          'sent</strong>. If this run is ever stood down, somebody has to ring them. They are on ' +
          'the "To telephone" list.</div>'
        : '<div class="note">Text messages and emails are <strong>not switched on yet</strong>, so ' +
          'nothing has been sent to them either way. Until they are, treat every booking as one ' +
          'somebody may have to ring.</div>') +
      (d.is_override ? '<div class="note">This one used seat 13 or 14.</div>' : '') +

      /* THE THING THE CALLER IS ABOUT TO ASK FOR ANYWAY. Almost nobody on
         this route travels one way: Inverness is a day out, and somebody
         booking the morning is booking the afternoon in the same breath.
         Making the office type it all again is not merely slow - it is
         where the mistakes come from. A name spelt differently the second
         time makes two customers out of one woman, and the walking frame
         gets left off the run that most needs the driver to wait. */
      (take.direction === "outward"
        ? '<button class="btn wide" id="gohome">Now book their journey home</button>' +
          '<p class="muted">Everything is carried over from ' + esc(d.reference) +
          ' — you only untick anybody who is not coming back.</p>' +
          '<p></p>'
        : '') +

      '<button class="btn ' + (take.direction === "outward" ? "secondary " : "") +
        'wide" id="another">Take another booking</button>' +
      '<p></p><button class="btn secondary wide" id="seeday">See that day</button>' +
      '</div>';
    el("another").onclick = () => { resetTake(); render(); };
    el("seeday").onclick = () => { day.date = take.date; TAB = "day"; resetTake(); loadDay(); };
    if(el("gohome")) el("gohome").onclick = () => goHome(d.booking_id);
    return;
  }

  if(take.homeBusy){
    M().innerHTML = '<div class="card"><h2>The journey home</h2>' +
      '<p class="muted">Fetching what they told you this morning…</p></div>';
    return;
  }

  const stops = DIR[take.direction] || [];
  const pickStop = stops.find(s => s.id === take.pickupId);
  const pickOrder = take.pin ? take.pin.order : (pickStop ? pickStop.o : null);

  let html = '<div class="card">' +
    '<h2>' + (take.homeFrom ? 'Their journey home' : 'Take a booking over the telephone') + '</h2>' +

    /* Everything below is already filled in from the morning's booking.
       Saying so plainly matters: a form that arrives full and does not

        (take.homeFrom.note
          /* SHOWN, not copied. "Green gate past the bridge" is about this
             morning's pick-up and means nothing outside Inverness bus
             station at five o'clock. The office reads it and decides. */
          ? '<div class="note"><strong>What they told you this morning:</strong> ' +
            esc(take.homeFrom.note) +
            '<br><span class="hint">Not carried over — it may have been about the ' +

          : '') +
        (take.homeFrom.stopsKnown
          ? ''
          : '<div class="note">' + esc(take.homeFrom.reason ||
              'One of those places has no position on the journey home.') +
            ' Choose where they get on and off below.</div>') +
        (take.homeFrom.setdown
          ? '<div class="note">Coming home, the bus can only set people down past ' +
            'Lochcarron — it cannot pick up there. Check where she is actually getting on.</div>'
          : '')
      : '') +

    '<label for="td">Which day</label>' +

    '<p class="muted" style="margin:.35rem 0 0">' + esc(niceDate(take.date)) + '</p>' +

    '<h3>Which way</h3>' +
    '<div class="pick">' +
      '<button data-dir="outward" aria-pressed="' + (take.direction === "outward") + '">To Inverness</button>' +
      '<button data-dir="return" aria-pressed="' + (take.direction === "return") + '">Home from Inverness</button>' +

      (take.customer.blocked_online
        ? '<br><span class="chip warn">must telephone: ' + esc(take.customer.block_reason || "") + '</span>' +
          '<br><span class="muted">That is fine — this is the telephone.</span>'

      }
    }
    html +=

  html += '<h3>The journey</h3>' +
    '<label for="pt">How many travelling <span class="hint">Count everybody, including anyone ' +

function wireTake(){
  const keep = () => {
    if(el("td")) take.date = el("td").value;
    if(el("q")) take.search = el("q").value;
    if(el("nm")) take.newName = el("nm").value;
    if(el("ha")) take.homeArea = el("ha").value;
    if(el("mob")) take.mobile = el("mob").value;
    if(el("ll")) take.landline = el("ll").value;
    if(el("em2")) take.email = el("em2").value;
    if(el("pt")) take.party = Math.max(1, parseInt(el("pt").value, 10) || 1);
    if(el("pu")) take.pickupId = el("pu").value;
    if(el("de")) take.destId = el("de").value;
    if(el("op")) take.otherPassengers = el("op").value;
    if(el("nt")) take.note = el("nt").value;
    if(el("ow")) take.overrideReason = el("ow").value;
  };
  M().querySelectorAll("input,select,textarea").forEach(i => { i.onchange = keep; i.oninput = keep; });

  M().querySelectorAll(".pick button").forEach(b => {
    b.onclick = async () => {
      keep();
      take.direction = b.dataset.dir;
      take.pickupId = ""; take.destId = ""; take.pin = null;
      await loadDirection(take.direction);
      render();
    };
  });
  if(el("pu")) el("pu").onchange = () => { keep(); render(); };
  if(el("find")) el("find").onclick = () => { keep(); doFind(); };
  if(el("q")) el("q").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); keep(); doFind(); } };
  if(el("clearcust")) el("clearcust").onclick = () => {
    take.customer = null; take.results = null; render();
  };
  M().querySelectorAll(".results button").forEach(b => {
    b.onclick = () => {
      take.customer = take.results[Number(b.dataset.i)];
      take.newName = take.customer.display_name;
      render();
    };
  });
  if(el("usepin")) el("usepin").onclick = () => { keep(); take.pinMode = !take.pinMode; render(); };
  if(el("clearpin")) el("clearpin").onclick = () => {
    take.pin = null; take.pinMode = false; render();
  };
  if(el("ack")) el("ack").onchange = () => { take.ackNoMessages = el("ack").checked; };
  M().querySelectorAll("[data-req]").forEach(c => {
    c.onchange = () => { take.reqs[c.dataset.req] = c.checked; };
  });
  el("submit").onclick = () => { keep(); doTake(); };
}

async function doFind(){
  if(!take.search.trim()){ take.results = []; return render(); }
  take.searching = true; render();
  try{
    take.results = await rpc("bus_staff_find_customer", {p_query: take.search.trim()});
  }catch(e){
    take.results = []; take.error = say(e);
  }
  take.searching = false; render();
}

/* One map, kept alive, exactly as the public page does it — a rebuilt
   map throws away the zoom and flies back out to the whole route, which
   is maddening when you are trying to find one house. */
let SMAPEL = null, SMAP = null, SMARKER = null, SMAPDIR = null;
function mountStaffMap(){
  const slot = el("staffmap");
  if(!slot) return;
  if(!SMAPEL){
    SMAPEL = document.createElement("div");
    SMAPEL.style.cssText = "height:100%;width:100%";
    slot.appendChild(SMAPEL);
    SMAP = new maplibregl.Map({
      container: SMAPEL,
      style: {version: 8,
        sources: {osm: {type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
          tileSize: 256, attribution: "© OpenStreetMap contributors"}},
        layers: [{id: "osm", type: "raster", source: "osm"}]},
      center: [-5.0, 57.5], zoom: 7
    });
    SMAP.addControl(new maplibregl.NavigationControl({showCompass: false}));
    SMAP.on("load", () => {
      SMAP.addSource("route", {type: "geojson", data: {type: "FeatureCollection", features: []}});
      SMAP.addLayer({id: "route", type: "line", source: "route",
        paint: {"line-color": "#1f5f8b", "line-width": 4, "line-opacity": .85}});
      syncStaffMap(true);
    });
    SMAP.on("click", e => {
      const line = routeFor(take.direction);
      if(!line) return;
      const p = projectToLine(line, [e.lngLat.lng, e.lngLat.lat]);
      const info = describeAlong(take.direction, p.along);
      if(info.snapped){
        take.pin = null;
        take.pickupId = info.snapped.id;
        take.pinMode = false;
      }else{
        take.pin = {lat: p.point[1], lng: p.point[0], order: info.order, text: info.text};
        take.pickupId = "";
      }
      render();
    });
  }else{
    slot.appendChild(SMAPEL);
    SMAP.resize();
  }
  syncStaffMap(false);
}
function syncStaffMap(force){
  if(!SMAP || !SMAP.getSource("route")) return;
  const gj = (CFG.routes || {})[take.direction];
  const coords = gj && gj.geometry && gj.geometry.coordinates;
  SMAP.getSource("route").setData(coords
    ? {type: "Feature", geometry: {type: "LineString", coordinates: coords}}
    : {type: "FeatureCollection", features: []});
  if(coords && (force || SMAPDIR !== take.direction)){
    const b = new maplibregl.LngLatBounds();
    coords.forEach(c => b.extend(c));
    SMAP.fitBounds(b, {padding: 30, duration: 0});
    SMAPDIR = take.direction;
  }
  if(take.pin){
    if(!SMARKER) SMARKER = new maplibregl.Marker({color: "#a3241c"}).setLngLat([take.pin.lng, take.pin.lat]).addTo(SMAP);
    else SMARKER.setLngLat([take.pin.lng, take.pin.lat]);
  }else if(SMARKER){ SMARKER.remove(); SMARKER = null; }
}

async function doTake(){
  take.error = null;
  const stops = DIR[take.direction] || [];
  const pickStop = stops.find(s => s.id === take.pickupId);
  const destStop = stops.find(s => s.id === take.destId);

  if(!take.pin && !pickStop) return fail("Choose where the bus is picking them up.");
  if(!destStop) return fail("Choose where they are getting off.");
  const boardOrder = take.pin ? take.pin.order : pickStop.o;
  if(destStop.o <= boardOrder) return fail(SAY.invalid_journey_span);
  const name = (take.customer ? take.customer.display_name : take.newName).trim();
  if(name.length < 2) return fail(SAY.lead_passenger_name_required);
  if(!take.customer && !take.mobile.trim() && !take.landline.trim() && !take.email.trim())
    return fail(SAY.some_way_to_reach_them_required);
  if(take.override && !take.overrideReason.trim()) return fail(SAY.override_needs_a_reason);

  const payload = {
    service_date: take.date,
    direction: take.direction,
    lead_passenger_name: name,
    party_size: take.party,
    board_route_order: boardOrder,
    alight_route_order: destStop.o,
    destination_point_id: destStop.id,
    channel: "phone",
    customer_id: take.customer ? take.customer.customer_id : null,
    mobile: take.mobile.trim() || null,
    landline: take.landline.trim() || null,
    email: take.email.trim() || null,
    home_area: take.homeArea.trim() || null,
    note: take.note.trim() || null,
    other_passengers: take.otherPassengers.split("\n").map(s => s.trim()).filter(Boolean),
    requirements: REQS.filter(r => take.reqs[r.k]).map(r => ({type: r.k})),
    override: take.override,
    override_reason: take.override ? take.overrideReason.trim() : null,
    confirm_no_notification: take.ackNoMessages
  };
  /* Joins the two halves of the day to each other, so a stand-down or a
     cancellation on one is visible from the other. */
  if(take.linkTo) payload.link_to = take.linkTo;
  if(take.pin){
    payload.pickup_latitude = take.pin.lat;
    payload.pickup_longitude = take.pin.lng;
    payload.pickup_description = take.pin.text;
  }else{
    payload.pickup_point_id = pickStop.id;
  }

  take.busy = true; render();
  try{
    const r = await rpc("bus_staff_create_booking", {p_payload: payload});
    take.busy = false;
    take.done = r;
    render();
  }catch(e){
    take.busy = false;
    if((e.code || "") === "no_auto_contact_needs_acknowledgement"){
      take.ackNeeded = true;
      take.error = SAY.no_auto_contact_needs_acknowledgement;
    }else if((e.code || "") === "full_but_override_possible" && !take.override){
      take.override = true;
      take.error = SAY.full_but_override_possible +
        " If you are going to use one, say why and press the button again.";
    }else{
      take.error = say(e);
    }
    render();
  }
  function fail(m){ take.error = m; render(); }
}

/* ---------------------- The journey home ----------------------
   The machinery for this was written on 29 July and has its own database
   test. Until today nothing had ever called it: there was no public
   wrapper and no button, so it sat finished behind a wall. This is the
   button.

   It fills the form in and stops. It does NOT book anything, because the
   party coming home is very often not the party that went out - somebody
   stays on for tea, somebody gets a lift - and a booking made on an
   assumption is a seat held for a person who never appears. */
async function goHome(bookingId){
  take.homeBusy = true; render();
  let s;
  try{
    s = await rpc("bus_staff_suggest_return", {p_booking_id: bookingId});
  }catch(e){
    take.homeBusy = false; take.error = say(e); render(); return;
  }
  take.homeBusy = false;

  if(!s || s.ok === false){
    take.error = say({code: (s && s.reason) || "unknown"}, "carried over");
    render(); return;
  }

  const dayBefore = take.date;
  resetTake();
  take.date      = s.service_date || dayBefore;
  take.direction = "return";

  /* The SAME customer, by id. Without this the office types the number in
     again and one woman quietly becomes two customer records, which then
     breaks "have we got a number for her?" for ever afterwards. */
  take.customer = s.customer_id
    ? {customer_id: s.customer_id, display_name: s.lead_passenger_name,
       contacts: [s.mobile, s.landline, s.email].filter(Boolean).join(" / "),
       home_area: s.home_area || ""}
    : null;
  take.newName  = s.lead_passenger_name || "";
  take.homeArea = s.home_area || "";
  take.mobile   = s.mobile   || "";
  take.landline = s.landline || "";
  take.email    = s.email    || "";
  take.party    = Number(s.party_size) || 1;
  take.otherPassengers = (s.passengers || []).join("\n");

  /* The requirements come too. This is the walking frame, and it is the
     reason "nearly pre-populated" was not good enough: the run that most
     needs the driver to wait at the step is the one at the end of the
     day, when everybody is tired and nobody retypes anything. */
  take.reqs = {};
  (s.requirements || []).forEach(r => { if(r && r.type) take.reqs[r.type] = true; });

  /* The note is SHOWN, never copied. "Green gate past the bridge" is
     about this morning's pick-up; at five o'clock she is standing outside
     Inverness bus station and there is no gate. The office reads it and
     decides. */
  take.homeFrom = {
    reference: s.outward_reference || "",
    note: s.note_from_the_outward_journey || "",
    stopsKnown: s.stops_known !== false,
    reason: s.reason || "",
    setdown: !!s.boarding_in_setdown_section
  };
  take.linkTo = s.linked_booking_id || bookingId;

  await loadDirection("return");
  if(s.stops_known !== false){
    take.pickupId = s.pickup_point_id || "";
    take.destId   = s.destination_point_id || "";
  }
  render();
}

function resetTake(){
  const d = take.date, dir = take.direction;
  Object.assign(take, {
    date: d, direction: dir, customer: null, search: "", results: null, searching: false,
    newName: "", homeArea: "", mobile: "", landline: "", email: "", party: 1,
    pickupId: "", destId: "", pin: null, pinMode: false, reqs: {}, otherPassengers: "",
    note: "", override: false, overrideReason: "",
    ackNoMessages: false, ackNeeded: false, busy: false, error: null, done: null,
    /* Cleared deliberately. A linkTo left behind from an earlier booking
       would join this journey home to the wrong passenger's morning. */
    homeBusy: false, homeFrom: null, linkTo: null
  });
}

/* --------------------------- To telephone --------------------------- */
function renderRing(){
  let html = '<div class="card">' +
    '<h2>Who has to be telephoned</h2>' +
    '<p class="muted">Everyone on this list has given us a landline and nothing else. If a run ' +
    'is stood down, no text and no email reaches them — somebody has to ring. On the worst ' +
    'morning of the year this is the screen that matters.</p>' +
    '<label for="rd">Which day</label>' +
    dayPicker("rd", ring.date) +
    '</div>';

  if(!ring.loaded){ html += '<div class="card">Loading…</div>'; }
  else if(!ring.rows.length){
    html += '<div class="card"><div class="good">Nobody. Everyone booked that day can be ' +
            'reached by text or email.</div></div>';
  }else{
    html += '<div class="card"><table><thead><tr>' +
      '<th>Who</th><th>Telephone</th><th>Where</th><th>Due</th></tr></thead><tbody>' +
      ring.rows.map(r =>
        '<tr><td><strong>' + esc(r.lead_name) + '</strong><br>' +
        '<span class="muted">' + esc(r.reference) + ' · ' + r.party_size +
        (Number(r.party_size) === 1 ? " person" : " people") + ' · ' +
        (r.direction === "outward" ? "to Inverness" : "home") + '</span></td>' +
        '<td>' + (r.telephone
          ? '<a href="tel:' + esc(String(r.telephone).replace(/\s/g, "")) + '">' + esc(r.telephone) + '</a>'
          : '<span class="chip tel">no number!</span>') + '</td>' +
        '<td>' + esc(r.pickup) + '</td>' +
        '<td>' + esc(r.estimated ? String(r.estimated).slice(0, 5) : "—") + '</td></tr>').join("") +
      '</tbody></table></div>';
  }
  M().innerHTML = html;
  el("rd").onchange = e => { ring.date = e.target.value; loadRing(); };
}
async function loadRing(){
  ring.loaded = false; render();
  try{ ring.rows = await rpc("bus_staff_call_list", {p_service_date: ring.date}) || []; }
  catch(e){ ring.rows = []; }
  ring.loaded = true; render();
}

/* ------------------------------------------------------------------
   Start
------------------------------------------------------------------ */
el("signout").onclick = () => { saveSession(null); ME = null; render(); };
el("tabs").onclick = e => {
  const b = e.target.closest("button[data-tab]");
  if(!b) return;
  TAB = b.dataset.tab;
  if(TAB === "day") return loadDay();
  if(TAB === "ring") return loadRing();
  render();
};

async function afterSignIn(){
  M().innerHTML = '<div class="card">Just a moment…</div>';
  try{
    ME = await rpc("bus_staff_whoami", {});
  }catch(e){
    saveSession(null);
    ME = null;
    render();
    return;
  }
  if(!ME.active){ render(); return; }
  try{
    CFG = await rpc("bus_page_config", {});
    await loadDays();
    await loadDirection("outward");
  }catch(e){
    M().innerHTML = '<div class="card"><div class="bad">' + esc(say(e)) + '</div></div>';
    return;
  }
  TAB = "day";
  loadDay();
}

loadSession();
if(SESSION) afterSignIn(); else render();
</script>
