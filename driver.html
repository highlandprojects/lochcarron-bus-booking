          window.alert("This one needs signal — it texts and emails everybody on the run, "
            + "so it cannot wait in the queue the way your taps do. Try again when you have "
            + "a bar, or ring the office and they will do it.");
          delete state.late[state.dayIdx];
        }else{
          const jid = journeyIdFor(state.dayIdx, state.leg);
          if(jid) rpc("bus_delay_journey", {p_journey_id: jid, p_minutes: n,
                       p_reason: null, p_from: "driver"}).catch(e => window.alert(say(e)));
        }
        state.ask = null;
        state.pending++;
        render();
        if(state.online) setTimeout(()=>{ state.pending=0; render(); }, 700);
      };
      pad.appendChild(b);
    });
    if(state.late[state.dayIdx]){
      const off = el(`<button class="cancel">${a.ahead
        ? "It will be on time after all — stop showing it"
        : "On time after all — stop showing it"}</button>`);
      off.onclick = () => {
        /* Deliberately silent. Nobody needs a message saying the bus is no
           longer late; they need one when it is. */
        delete state.late[state.dayIdx]; state.ask = null; render();
        const jid = journeyIdFor(state.dayIdx, state.leg);
        if(jid) rpc("bus_clear_delay", {p_journey_id: jid}).catch(() => {});
      };
      inner.appendChild(off);
    }

  } else if(a.kind === "receipt"){
    /* WHAT IT IS FOR, then the camera. Two taps, and the amount is
       deliberately optional — asking a man holding a fuel nozzle to type
       84.50 correctly is how you get 8450. Kay reads it off the picture. */
    inner = el(`<div class="inner">
      <h2>Photograph the receipt</h2>
      <p class="sub">The picture is enough on its own. You do not have to type the amount
        &mdash; the office reads it off. Take another if you fill up again later.</p>
      <ul class="places"></ul>
    </div>`);
    const ul = inner.querySelector(".places");
    [["Fuel","&#9981;"],["AdBlue","&#128167;"],["Both on one receipt","&#129534;"]].forEach(([label,icon])=>{
      const li = el(`<li><button class="primary">${icon} ${label}</button></li>`);
      li.querySelector("button").onclick = () => {
        state.receiptSeq++;
        state.receipts.push({id:state.receiptSeq, dayIdx:state.dayIdx,
          at:hhmm(new Date()), kind:label, amount:null});
        state.ask = null;
        state.pending++;
        render();
        if(state.online) setTimeout(()=>{ state.pending=0; render(); }, 700);
      };
      ul.appendChild(li);
    });

  } else if(a.kind === "dest"){
    /* WHERE THEY GOT OFF. End of the run, handbrake on. Kay needs it for
       the Council return, and the driver is told that plainly — a question
       with a reason attached gets answered. */
    const w = state.walkOns.find(x=>x.id === a.id);
    if(!w){ state.ask = null; return; }
    inner = el(`<div class="inner">
      <h2>Where did they get off?</h2>
      <p class="sub">${w.count} ${w.count===1?"person":"people"} who got on
        ${w.where ? "at " + esc(w.where) : ""} at ${esc(w.at)}.
        Kay needs this for the Council return.</p>
      <ul class="places"></ul>
    </div>`);
    const ul = inner.querySelector(".places");

    /* Inverness first on the way in, Applecross first on the way home.
       Nine times out of ten it is the end of the line, so the end of the
       line goes at the top rather than at the bottom of fifteen. */
    const stops = STOPS[w.leg];
    const likely = stops[stops.length-1];
    const rest = stops.filter(n => n !== likely && n !== w.where);
    const pick = name => () => {
      sayWalkOnDest(w, name);
      state.ask = null; render();
    };

    const first = el(`<li><button class="primary">${esc(likely)}
      <span class="m">All the way &mdash; usually the answer</span></button></li>`);
    first.querySelector("button").onclick = pick(likely);
    ul.appendChild(first);

    rest.forEach(name=>{
      const li = el(`<li><button>${esc(name)}</button></li>`);
      li.querySelector("button").onclick = pick(name);
      ul.appendChild(li);
    });

    const later = el(`<li><button>I cannot remember
      <span class="m">Leave it blank. The office would rather have a gap than a guess.</span>
      </button></li>`);
    later.querySelector("button").onclick = () => { state.ask = null; render(); };
    ul.appendChild(later);

  } else if(a.kind === "dropped"){
    /* A BOOKED PASSENGER WHO GOT OFF SOMEWHERE ELSE. The operator's own
       idea, and the only reason this screen is short: everybody else is
       assumed to have done what they said, so there is nothing to confirm. */
    inner = el(`<div class="inner">
      <h2>Where did they actually get off?</h2>
      <p class="sub">They booked to ${esc(a.leg)}. What gets recorded is only the
        difference &mdash; the booking itself is left exactly as it was.</p>
      <ul class="places"></ul>
    </div>`);
    const ul = inner.querySelector(".places");
    /* Both directions offered, because a booking's own leg is not always
       the leg he is standing on when he remembers. */
    [...new Set(STOPS.outward)].forEach(name=>{
      if(name === a.leg) return;
      const li = el(`<li><button>${esc(name)}</button></li>`);
      li.querySelector("button").onclick = () => {
        state.dropped[a.ref] = name; state.ask = null;
        /* Never written back onto the booking: the booked stages are the
           basis of the fare and of the Council claim. This is a
           DIFFERENCE, stored beside them. */
        const ds = findStop(a.ref);
        if(ds && ds.bookingId) enqueue("bus_driver_different_alighting",
          {p_booking_id: ds.bookingId, p_pickup_point_id: null,
           p_description: name, p_note: null});
        state.pending++; render();
        if(state.online) setTimeout(()=>{ state.pending=0; render(); }, 600);
      };
      ul.appendChild(li);
    });

  } else {
    /* SAYING WHERE, LATER. Parked, handbrake on, or that evening at home.
       Nothing here is urgent and the wording says so. */
    const w = state.walkOns.find(x=>x.id === a.id);
    if(!w){ state.ask = null; return; }
    inner = el(`<div class="inner">
      <h2>Where did they get on?</h2>
      <p class="sub">${w.count} ${w.count===1?"person":"people"} at ${esc(w.at)}.
        Kay needs this for the Council return, but it can wait until you have
        stopped.</p>
      <ul class="places"></ul>
    </div>`);
    const ul = inner.querySelector(".places");

    const here = el(`<li><button class="primary">Use where I am now
      <span class="m">Best if you are still at the spot</span></button></li>`);
    here.querySelector("button").onclick = (ev) => {
      const btn = ev.currentTarget;
      btn.innerHTML = "Asking the phone…";
      locate(w, ok => {
        if(ok){ state.ask = null; render(); }
        else {
          btn.innerHTML = `The phone could not say where you are
            <span class="m">No signal or location turned off — pick from the list instead</span>`;
        }
      });
    };
    ul.appendChild(here);

    /* The list is offered whether or not the phone managed a fix, because
       the phone can be confidently wrong on that road — the wrong side of
       a village is 400 metres and two fare stages. */
    STOPS[w.leg].forEach(name=>{
      const li = el(`<li><button>${esc(name)}${
        name === w.where ? `<span class="m">what the phone thought</span>` : ""}</button></li>`);
      li.querySelector("button").onclick = () => {
        sayWalkOnPlace(w, name);
        state.ask = null; render();
      };
      ul.appendChild(li);
    });

    const later = el(`<li><button>Leave it for now
      <span class="m">The ${w.count} ${w.count===1?"person":"people"} and the time are
      already saved. Nothing is lost.</span></button></li>`);
    later.querySelector("button").onclick = () => { state.ask = null; render(); };
    ul.appendChild(later);
  }

  const cancel = el(`<button class="cancel">Close &mdash; record nothing</button>`);
  cancel.onclick = () => { state.ask = null; render(); };
  inner.appendChild(cancel);

  const sheet = el(`<div class="sheet"></div>`);
  sheet.appendChild(inner);
  /* Tapping the dark area closes it. Tapping the sheet itself must not —
     a fat thumb on the edge of a button should never throw the job away. */
  sheet.addEventListener("click", ev => {
    if(ev.target === sheet){ state.ask = null; render(); }
  });
  document.body.appendChild(sheet);
}

/* ------------------------------------------------------------------
   HAVE YOU GOT SPACE?
   ------------------------------------------------------------------
   The operator's own words: "someone could be traveling and say have you
   got space on way back or next week". That is the question passengers
   ask the man driving them, and until now he had to say he did not know.

   HE MAY LOOK AND ONLY LOOK. There is no button on this phone that books
   anybody - the operator was asked directly and said so. What he can do
   is answer, and then tell them to ring the office.

   It is not a separate screen. The day tabs across the top already open
   any day's sheet, so the seats simply go ON those tabs and on the two
   direction cards. One less thing to find, and it works with no signal
   because the days came down with the rest of the sheet.
------------------------------------------------------------------ */
function seatsOn(i, leg){
  const row = DAYROWS[i];
  if(!row) return null;
  const n = leg === "return" ? row.seats_home : row.seats_out;
  return n === null || n === undefined ? null : Number(n);
}
function seatWords(n){
  if(n === null) return "";
  if(n <= 0) return "FULL";
  return n + " seat" + (n === 1 ? "" : "s") + " free";
}

/* A day he is not driving today is a day he may look at and nothing more.
   Ticking somebody onto next Monday's bus is not a thing that can have
   happened, and offering it invites a tap that would have to be undone. */
function lookOnly(){ return !isTodayIdx(state.dayIdx); }

/* WHICH DAY IS TODAY IS THE DATABASE'S ANSWER, NOT THE PHONE'S.
   A phone with the wrong date - or one being looked at the night before -
   would otherwise treat the wrong day as the one he is driving, and the
   two places that ask ("is this look-only?" and "does the tab say
   Today?") could disagree with each other. The day list already carries
   is_today, so both ask it. The clock is only the fallback for a phone
   that has never had signal. */
function isTodayIdx(i){
  const row = DAYROWS[i];
  if(row && row.is_today !== undefined && row.is_today !== null) return !!row.is_today;
  const d = DAYS[i];
  return !!d && ymd(d) === ymd(TODAY);
}

function setTap(ref, what){
  if(lookOnly()) return;
  /* Tapping the same thing twice is harmless. Tapping the other one
     replaces it: somebody marked absent who then got on is not evidence
     of anything. */
  if(state.taps[ref]===what) return;
  state.taps[ref]=what;
  render();
  /* REAL NOW. It goes on the queue, which sends it the moment there is a
     bar and holds it on the phone until then. The tap is never waiting on
     the network - that is the whole design of this screen. */
  const s = findStop(ref);
  if(s && s.bookingId){
    enqueue("bus_driver_tap", {
      p_booking_id: s.bookingId, p_event: what,
      p_occurred_at: new Date().toISOString(),
      p_recorded_offline_at: state.online ? null : new Date().toISOString()
    });
  }
}

/* Undoing a tap must reach the database too, or the sheet and the record
   disagree the moment he reloads. */
function clearTap(ref){
  const had = state.taps[ref];
  delete state.taps[ref];
  render();
  const s = findStop(ref);
  if(s && s.bookingId && had) enqueue("bus_driver_untap",
    {p_booking_id: s.bookingId, p_event: had});
}

function findStop(ref){
  for(const sh of SHEETS){
    for(const leg of ["outward","return"]){
      const hit = (sh[leg]||[]).find(x => x.ref === ref);
      if(hit) return hit;
    }
  }
  return null;
}

/* The signal state is the phone's own, not a toggle. */
state.online = navigator.onLine !== false;

function journeyIdFor(dayIdx, leg){
  const sh = SHEETS[dayIdx];
  if(!sh) return null;
  const row = (sh[leg] || [])[0];
  return row ? row.journeyId : null;
}

/* ------------------------------------------------------------------
   Getting in, and getting the day
------------------------------------------------------------------ */
function renderSignIn(msg){
  document.getElementById("signin").classList.remove("hidden");
  document.getElementById("app").innerHTML = "";
  document.getElementById("signin").innerHTML =
    '<main style="padding:1rem;max-width:640px;margin:0 auto">' +
    '<div class="signincard">' +
    '<p class="place">Sign in</p>' +
    '<p class="detail">Your usual Ross Group staff login — the same one you use for ' +
    'tyres and the rest. There is no separate bus password.</p>' +
    (msg ? '<p class="flag ovr">' + esc(msg) + '</p>' : '') +
    '<p style="margin:.7rem 0 .2rem"><label for="em">Email address</label></p>' +
    '<input id="em" type="email" autocomplete="username" inputmode="email" ' +
    'style="width:100%;font:inherit;padding:.7rem;border:2px solid var(--line);border-radius:9px">' +
    '<p style="margin:.7rem 0 .2rem"><label for="pw">Password</label></p>' +
    '<input id="pw" type="password" autocomplete="current-password" ' +
    'style="width:100%;font:inherit;padding:.7rem;border:2px solid var(--line);border-radius:9px">' +
    '<button id="go" class="signinbtn" style="margin-top:1rem">Sign in</button>' +
    '</div></main>';
  document.getElementById("go").onclick = async () => {
    try{
      await signIn(document.getElementById("em").value.trim(),
                   document.getElementById("pw").value);
      document.getElementById("signin").classList.add("hidden");
      await boot();
    }catch(e){ renderSignIn(say(e)); }
  };
}

async function boot(){
  try{
    ME = await rpc("bus_staff_whoami");
  }catch(e){
    if(e.status === 401 || /JWT|token/i.test(String(e.code))){
      SESSION = null; forget(K.session); return renderSignIn("Please sign in again.");
    }
    ME = null;
  }
  /* A GARAGE LOGIN THAT HAS NOT BEEN GIVEN THE BUS YET.
     This is not the same as a dead account, and telling a driver his
     account is not active when it is would send him to the wrong person.
     It is one line on the staff screen Duncan already uses, and saying so
     is the difference between a two-minute fix and a phone call. */
  if(ME && ME.has_login_but_no_bus_access){
    document.getElementById("app").innerHTML =
      '<div class="empty"><strong>Your login does not open the bus yet.</strong><br><br>' +
      'Signed in as ' + esc(ME.name || ME.email || "") + ', but the bus has not been ' +
      'switched on for you.<br><br>Ask Duncan — it is one line on the staff screen he ' +
      'already uses. Same login, no new password.</div>';
    return;
  }
  if(ME && ME.active === false){
    document.getElementById("app").innerHTML =
      '<div class="empty">Your account cannot open the bus screens. Ask Duncan.</div>';
    return;
  }
  await loadEverything();
  /* WHAT THE DATABASE SAYS IS STILL UNANSWERED.
     Walk-ons live in the database from the moment he taps, but the
     questions about them - where they got on, where they got off - were
     only ever held in this page. Reload the phone and they vanished from
     the screen while sitting unanswered in Kay's Council return. This
     puts them back. */
  seedCorrections();
  await loadOutstanding();
  await loadLate();
  state.pending = QUEUE.length;
  flush();
  render();
}

/* Just the office's summary, on its own, for when he opens the finish
   screen. Quiet: if there is no signal the last figures stay up and the
   list he has to answer is on the phone regardless. */
async function refreshEndRun(){
  const date = dateOfDay(todayIdx());
  if(!date) return;
  try{
    const said = await rpc("bus_driver_end_of_run", {p_service_date: date});
    if(said && typeof said === "object" && !Array.isArray(said)){
      ENDRUN = said;
      if(state.view === "finish") render();
    }
  }catch(_){}
}

/* ------------------------------------------------------------------
   The questions the database still wants answered
------------------------------------------------------------------ */
/* A CORRECTION ALREADY IN THE DATABASE.
   Made last night, or from the office, or before this phone was reloaded.
   Without this it vanishes off the screen while sitting in the record,
   and he makes it a second time. */
function seedCorrections(){
  (SHEETS || []).forEach(day => {
    ["outward","return"].forEach(leg => {
      (day[leg] || []).forEach(s => {
        if(s.gotOff) state.dropped[s.ref] = s.gotOff;
        /* AND THE TICKS THEMSELVES. A boarding already in the database -
           tapped this morning before the phone was reloaded, or by
           whoever drove the first half - has to be on the screen. Without
           this every tick vanishes on reload while sitting in the record,
           and he taps them all again. */
        if(!state.taps[s.ref]){
          if(s.boarded) state.taps[s.ref] = "boarded";
          else if(s.noShow) state.taps[s.ref] = "no_show";
        }
      });
    });
  });
}

async function loadOutstanding(){
  /* The day he is DRIVING, which the database names - not simply the
     first row, for the same reason as isTodayIdx. */
  let i = 0;
  for(let k = 0; k < DAYS.length; k++){ if(isTodayIdx(k)){ i = k; break; } }
  const date = dateOfDay(i);
  if(!date) return;
  let rows = [];
  try{ rows = await rpc("bus_driver_outstanding", {p_service_date: date}); }
  catch(_){ return; }   /* no signal: what is on the phone still shows */
  if(!Array.isArray(rows)) return;

  rows.forEach(r => {
    if(!r.walk_on_id) return;
    /* Already on this phone under its own id - do not ask twice. */
    const known = Object.keys(WALKON_IDS).some(k => WALKON_IDS[k] === r.walk_on_id);
    if(known) return;
    const localId = ++state.walkSeq;
    WALKON_IDS[localId] = r.walk_on_id;
    state.walkOns.push({
      id: localId,
      at: r.occurred_at ? hhmm(new Date(r.occurred_at)) : "—",
      count: Number(r.boarded_count) || 1,
      leg: r.direction === "return" ? "return" : "outward",
      dayIdx: i,
      where: r.got_on_at || null,
      off: null,
      metres: null,
      needsDetail: !r.got_on_at
    });
  });
  try{ keep(K.walkons, WALKON_IDS); }catch(_){}

  /* The end-of-run summary. Read only, and only ever used to say how the
     day went - nothing on this screen depends on it arriving. */
  try{ ENDRUN = await rpc("bus_driver_end_of_run", {p_service_date: date}); }
  catch(_){ ENDRUN = null; }
}
let ENDRUN = null;

/* ------------------------------------------------------------------
   Running late, as the OFFICE last left it
   ------------------------------------------------------------------
   The delay can be set from the office screen as well as from here, and
   a driver looking at a phone that says nothing while his passengers
   have all had a text saying twenty minutes is worse than no feature.
------------------------------------------------------------------ */
function todayIdx(){
  for(let k = 0; k < DAYS.length; k++){ if(isTodayIdx(k)) return k; }
  return 0;
}

async function loadLate(){
  const ids = [];
  ["outward","return"].forEach(leg => {
    const list = (SHEETS[todayIdx()] || {})[leg] || [];
    if(list.length && list[0].journeyId) ids.push(list[0].journeyId);
  });
  await Promise.all(ids.map(async id => {
    try{
      const st = await rpc("bus_journey_state", {p_journey_id: id});
      if(st && st.delay_minutes) state.late[todayIdx()] = {mins: Number(st.delay_minutes)};
    }catch(_){}
  }));
}

if(SESSION) boot(); else renderSignIn();
</script>
